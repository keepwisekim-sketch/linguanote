const CLAUDE_MODEL = "claude-haiku-4-5-20251001";
const askClaude = async (apiKey, system, user, history=[]) => {
  const msgs = [...history.map(m=>({role:m.role,content:m.content})), {role:"user",content:user}];
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:CLAUDE_MODEL, max_tokens:1024, system, messages:msgs})
  });
  const d = await r.json();
  if(d.error) throw new Error(d.error.message);
  return d.content?.map(b=>b.text||"").join("")||"";
};

// ── Main App ──
function LangApp({lc,apiKey,onBack,onResetKey}) {
  const lg=LANGS[lc]; const t=lg.th;

  const [vocab,setVocabRaw]=useState(()=>LS(`ln_vocab_${lc}`,lg.sample));
  const setVocab=fn=>setVocabRaw(prev=>{const next=typeof fn==="function"?fn(prev):fn;SS(`ln_vocab_${lc}`,next);fbSave(`vocab_${lc}`,next);return next;});

  const [notes,setNotesRaw]=useState(()=>LS(`ln_notes_${lc}`,[{text:"오늘부터 LinguaNote로 영어 공부 시작!",date:"2026-03-08"}]));
  const setNotes=fn=>setNotesRaw(prev=>{const next=typeof fn==="function"?fn(prev):fn;SS(`ln_notes_${lc}`,next);fbSave(`notes_${lc}`,next);return next;});

  useEffect(()=>{
    const load=async()=>{
      const v=await fbLoad(`vocab_${lc}`);if(v){setVocabRaw(v);SS(`ln_vocab_${lc}`,v);}
      const n=await fbLoad(`notes_${lc}`);if(n){setNotesRaw(n);SS(`ln_notes_${lc}`,n);}
    };
    if(window._fbReady)load();else window.addEventListener("fbready",load,{once:true});
  },[lc]);

  const [tab,setTab]=useState(0);
  const S=(ex={})=>({width:"100%",padding:"10px 14px",background:t.inp,border:"1px solid rgba(255,255,255,0.1)",borderRadius:8,color:t.tx,fontFamily:"inherit",fontSize:14,outline:"none",boxSizing:"border-box",...ex});

  // 단어장 상태
  const [nWord,setNWord]=useState(""); const [nMean,setNMean]=useState("");
  const [nEx,setNEx]=useState(""); const [nPhon,setNPhon]=useState("");
  const [nKorPron,setNKorPron]=useState(""); const [editIdx,setEditIdx]=useState(null);
  const [search,setSearch]=useState(""); const [filterMode,setFilterMode]=useState("all");
  const [youglishWord,setYouglishWord]=useState(null);
  const [autoFilling,setAutoFilling]=useState(false);

  // 복습 상태
  const [ci,setCi]=useState(0); const [flipped,setFlipped]=useState(false);
  const [rMode,setRMode]=useState("word"); const [score,setScore]=useState({ok:0,no:0});
  const [shuffled,setShuffled]=useState(null); const [smartMode,setSmartMode]=useState(true);
  const [writingMode,setWritingMode]=useState(false); const [writingText,setWritingText]=useState("");
  const [writingFeedback,setWritingFeedback]=useState(""); const [feedbackLoading,setFeedbackLoading]=useState(false);

  // 다이얼로그 상태
  const [dialogue,setDialogue]=useState(null); const [dialogueLoading,setDialogueLoading]=useState(false);

  // AI 대화 상태
  const [chatHistory,setChatHistory]=useState([]);
  const [chatInput,setChatInput]=useState(""); const [chatLoading,setChatLoading]=useState(false);
  const chatEndRef=useRef(null);

  // 음성 대화 상태
  const [voiceMode,setVoiceMode]=useState(false);
  const [voiceStatus,setVoiceStatus]=useState("idle");
  const [interimText,setInterimText]=useState("");
  const [geminiKey,setGeminiKey]=useState(()=>LS("ln_geminikey",""));
  const [showGeminiInput,setShowGeminiInput]=useState(false);
  const recognitionRef=useRef(null);
  const voiceModeRef=useRef(false);
  const chatHistoryRef=useRef([]);
  const silenceTimerRef=useRef(null);
  const currentTranscriptRef=useRef("");
  const audioRef=useRef(null);

  useEffect(()=>{ chatHistoryRef.current=chatHistory; },[chatHistory]);
  useEffect(()=>{ voiceModeRef.current=voiceMode; },[voiceMode]);

  // 탭 변경 시 전부 중지
  useEffect(()=>{
    recognitionRef.current?.stop();
    audioRef.current?.pause();
    clearTimeout(silenceTimerRef.current);
    setVoiceMode(false); voiceModeRef.current=false;
    setVoiceStatus("idle"); setInterimText(""); currentTranscriptRef.current="";
  },[tab]);

  const isIOS = useRef(/iPad|iPhone|iPod/.test(navigator.userAgent)).current;
  const pendingSpeakRef = useRef(null); // iOS용 대기 큐

  // ── speechSynthesis 기반 TTS (iOS 포함 모든 기기 폴백) ──
  const speakWithSpeechSynthesis = useCallback((cleanText, onDone) => {
    if(!window.speechSynthesis){ onDone?.(); return; }
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(cleanText);
    utter.lang = lc==="en"?"en-US":"zh-CN";
    utter.rate = 0.85;
    utter.volume = 1.0;
    const doSpeak = () => {
      const voices = window.speechSynthesis.getVoices();
      const voice = voices.find(v=>v.lang.startsWith(lc==="en"?"en-":"zh"))
                 || voices.find(v=>v.lang.startsWith(lc==="en"?"en":"zh"));
      if(voice) utter.voice = voice;
      utter.onend = ()=>{ setVoiceStatus("idle"); onDone?.(); };
      utter.onerror = (e)=>{ console.warn("SpeechSynthesis error:", e); setVoiceStatus("idle"); onDone?.(); };
      window.speechSynthesis.speak(utter);
      // iOS 버그: 15초 이상 텍스트에서 멈추는 현상 방지
      if(isIOS) {
        const resume = setInterval(()=>{
          if(!window.speechSynthesis.speaking){ clearInterval(resume); return; }
          window.speechSynthesis.pause();
          window.speechSynthesis.resume();
        }, 10000);
        utter.onend = ()=>{ clearInterval(resume); setVoiceStatus("idle"); onDone?.(); };
      }
    };
    const voices = window.speechSynthesis.getVoices();
    if(voices.length > 0) doSpeak();
    else { window.speechSynthesis.onvoiceschanged = ()=>{ window.speechSynthesis.onvoiceschanged=null; doSpeak(); }; }
  }, [lc, isIOS]);

  // ── TTS 메인 함수 ──
  const speak = useCallback(async (text, onDone) => {
    const cleanText = text.replace(/\([^)]*[\uAC00-\uD7A3][^)]*\)/g,"").trim();
    if(!cleanText){ onDone?.(); return; }
    setVoiceStatus("speaking");

    // iOS는 무조건 speechSynthesis (Blob 재생 불가)
    if(isIOS) {
      speakWithSpeechSynthesis(cleanText, onDone);
      return;
    }

    // PC/Android: Gemini TTS 시도
    if(geminiKey) {
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${geminiKey}`, {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({
            contents:[{parts:[{text:cleanText}]}],
            generationConfig:{ responseModalities:["AUDIO"], speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:"Aoede"}}} }
          })
        });
        const data = await res.json();
        const b64 = data?.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
        if(b64) {
          const bytes = new Uint8Array(atob(b64).split("").map(c=>c.charCodeAt(0)));
          const url = URL.createObjectURL(new Blob([bytes],{type:"audio/wav"}));
          if(!audioRef.current) audioRef.current = new Audio();
          audioRef.current.src = url;
          audioRef.current.onended=()=>{ URL.revokeObjectURL(url); setVoiceStatus("idle"); onDone?.(); };
          audioRef.current.onerror=()=>{ URL.revokeObjectURL(url); speakWithSpeechSynthesis(cleanText,onDone); };
          try { await audioRef.current.play(); return; } catch(e){}
        }
      } catch(e){ console.warn("Gemini TTS 실패:", e); }
    }
    speakWithSpeechSynthesis(cleanText, onDone);
  }, [lc, geminiKey, isIOS, speakWithSpeechSynthesis]);

  // Android용 오디오 잠금 해제
  const audioUnlockedRef = useRef(false);
  const unlockAudio = () => {
    if(isIOS||audioUnlockedRef.current) return;
    try { const ctx=new(window.AudioContext||window.webkitAudioContext)(); ctx.resume(); audioUnlockedRef.current=true; } catch(e){}
  };

  // ── STT: 침묵 감지 + iOS 안정성 개선 ──
  const SILENCE_MS = 2000;
  const listenOnce = useCallback((onResult) => {
    const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR||!voiceModeRef.current){ setVoiceStatus("idle"); return; }

    const rec = new SR();
    recognitionRef.current=rec;
    rec.lang = lc==="en"?"en-US":"zh-CN";
    // iOS는 continuous:true가 불안정 → false로 하고 onend에서 재시작
    rec.continuous = !isIOS;
    rec.interimResults = true;
    currentTranscriptRef.current="";
    let resultReceived = false;

    rec.onstart=()=>setVoiceStatus("listening");

    rec.onresult=(e)=>{
      resultReceived = true;
      let interim="", final="";
      for(let i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal) final+=e.results[i][0].transcript;
        else interim+=e.results[i][0].transcript;
      }
      if(final) currentTranscriptRef.current+=final;
      setInterimText(currentTranscriptRef.current+interim);

      clearTimeout(silenceTimerRef.current);
      silenceTimerRef.current = setTimeout(()=>{
        const text = currentTranscriptRef.current||interim;
        if(text.trim()&&voiceModeRef.current){
          rec.stop(); setInterimText(""); onResult(text.trim());
        } else if(voiceModeRef.current){ rec.stop(); }
      }, SILENCE_MS);
    };

    rec.onerror=(e)=>{
      clearTimeout(silenceTimerRef.current);
      if(e.error==="no-speech"&&voiceModeRef.current) setTimeout(()=>listenOnce(onResult),300);
      else if(e.error!=="aborted"){ setVoiceStatus("idle"); setVoiceMode(false); voiceModeRef.current=false; }
    };

    rec.onend=()=>{
      clearTimeout(silenceTimerRef.current);
      const text = currentTranscriptRef.current;
      if(text.trim()){
        // 이미 타이머가 onResult 호출했을 수 있으니 중복 방지
        return;
      }
      // 아무 말 없이 끝남 → 재시작 (iOS continuous:false라서 자주 발생)
      if(voiceModeRef.current && !resultReceived){
        setTimeout(()=>listenOnce(onResult), 200);
      } else if(voiceModeRef.current && isIOS && resultReceived){
        // iOS: isFinal 못 받은 채로 끝남 → 지금까지 내용으로 처리
        const text2 = currentTranscriptRef.current;
        if(text2.trim()){ setInterimText(""); onResult(text2.trim()); }
        else setTimeout(()=>listenOnce(onResult), 200);
      }
    };

    rec.start();
  },[lc, isIOS]);

  // ── 음성대화 루프 ──
  const startVoiceLoop = useCallback(() => {
    const loop = (historySnapshot) => {
      if(!voiceModeRef.current){ setVoiceStatus("idle"); return; }
      listenOnce(async (userText) => {
        if(!voiceModeRef.current){ setVoiceStatus("idle"); return; }
        const newHistory=[...historySnapshot,{role:"user",content:userText}];
        setChatHistory(newHistory); setVoiceStatus("thinking");
        try {
          const wordList=vocab.slice(0,20).map(v=>`${v.word}(${v.meaning})`).join(", ");
          const lang=lc==="en"?"English":"Chinese";
          // AI 응답을 음성부분 + 교정부분으로 분리해서 받기
          const sys=`You are a friendly native ${lang} speaker chatting with a Korean learner.
Student's vocabulary: ${wordList}
IMPORTANT - Format your response EXACTLY like this (two parts separated by "---"):
[Your natural ${lang} reply, 2-3 sentences]
---
[CORRECTION] If there's a grammar mistake, write it in Korean like: 교정: "wrong" → "correct". If no mistake, write: 교정없음
Example:
That's so interesting! Resilience is such an important quality in life. I admire people who can bounce back from challenges.
---
[CORRECTION] 교정: "I am go" → "I am going"`;

          const res=await askClaude(apiKey,sys,userText,historySnapshot);

          // --- 구분자로 음성 텍스트 / 교정 분리
          const parts = res.split("---");
          const spokenPart = parts[0].trim();
          const correctionPart = parts[1]?.replace("[CORRECTION]","").trim() || "";
          const showCorrection = correctionPart && correctionPart !== "교정없음" && correctionPart !== "교정: 없음";

          // 화면에는 전체 내용 표시 (교정 포함)
          const displayText = showCorrection
            ? `${spokenPart}\n\n✏️ ${correctionPart}`
            : spokenPart;

          const withAI=[...newHistory,{role:"assistant",content:displayText}];
          setChatHistory(withAI);

          // TTS는 음성 부분만 읽기 (교정 제외)
          speak(spokenPart,()=>{ if(voiceModeRef.current) loop(withAI); });
        } catch(e){
          setChatHistory(h=>[...h,{role:"assistant",content:"오류: "+e.message}]);
          setVoiceStatus("idle"); setVoiceMode(false); voiceModeRef.current=false;
        }
      });
    };
    loop(chatHistoryRef.current);

- Extract every ${lang} word or phrase you find

- Skip pure Korean text, keep ${lang} items only
- Return valid JSON array only`;
      const raw = await askClaude(apiKey, sys, importText.trim());
      const clean = raw.replace(/```json|```/g,"").trim();
      const parsed = JSON.parse(clean);

✅ 자연스러움 여부 (한 줄)
💡 개선점 (있으면 한 줄, 없으면 "완벽해요!")
📝 더 자연스러운 표현 (있으면)

Keep it short and encouraging.`;

Respond ONLY with JSON in this format:
{

      const raw = await askClaude(apiKey, sys, `Create a dialogue using: ${targetWords}`);

      const res = await askClaude(apiKey, sys, chatInput, chatHistory);

      <div style={{padding:"12px 16px 0",borderBottom:`1px solid ${t.bd}`,position:"sticky",top:0,background:t.bg,zIndex:10}}>

                  </div>
                </div>
              ):chatHistory.map((m,i)=>{
                const isUser=m.role==="user";
                return (
                  <div key={i} className="fade-in" style={{display:"flex",gap:10,marginBottom:12,flexDirection:isUser?"row-reverse":"row"}}>
                    <div style={{width:30,height:30,borderRadius:"50%",background:isUser?t.acBg:"rgba(80,120,200,0.2)",border:`1px solid ${isUser?t.acBd:"rgba(80,120,200,0.4)"}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,flexShrink:0,marginTop:2}}>
                      {isUser?"나":"AI"}
                    </div>
                    <div style={{maxWidth:"80%"}}>
                      <div style={{padding:"9px 13px",borderRadius:12,background:isUser?t.acDim:t.card,border:`1px solid ${isUser?t.acBd:t.bdD}`,fontSize:14,lineHeight:1.7,color:t.tx,whiteSpace:"pre-wrap"}}>
                        {m.content}
                      </div>
                      {!isUser&&(
                        <button onClick={()=>speak(m.content,null)} style={{marginTop:3,padding:"2px 10px",borderRadius:20,border:"1px solid rgba(80,120,200,0.3)",background:"transparent",color:"#8aa8e8",cursor:"pointer",fontSize:11}}>🔊 다시 듣기</button>
                      )}
                    </div>
                  </div>
                );
              })}
              {chatLoading&&(
                <div style={{display:"flex",gap:10,marginBottom:12}}>
                  <div style={{width:30,height:30,borderRadius:"50%",background:"rgba(80,120,200,0.2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11}}>AI</div>
                  <div style={{padding:"9px 13px",borderRadius:12,background:t.card,border:`1px solid ${t.bdD}`}}><Spinner /></div>
                </div>
              )}
              <div ref={chatEndRef} />
            </div>

            {/* 텍스트 입력 (수동 모드) */}
            {!voiceMode&&(
              <div style={{display:"flex",gap:8}}>
                <textarea value={chatInput} onChange={e=>setChatInput(e.target.value)}
                  onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendChat();}}}
                  placeholder={lc==="en"?"Or type here... (Enter to send)":"또는 여기에 입력... (Enter발송)"}
                  rows={2} style={{...S({flex:1,width:"auto",resize:"none"})}} />
                <button onClick={sendChat} disabled={chatLoading||!chatInput.trim()} style={{padding:"0 16px",borderRadius:8,background:t.acBg,border:`1px solid ${t.acBd}`,color:t.ac,cursor:"pointer",fontSize:18,opacity:!chatInput.trim()?0.4:1}}>
                  {chatLoading?<Spinner color={t.ac}/>:"→"}
                </button>
              </div>
            )}

            {chatHistory.length>0&&(
              <button onClick={()=>{if(voiceMode)return;setChatHistory([]);}} disabled={voiceMode} style={{marginTop:8,width:"100%",padding:"8px",borderRadius:8,background:"transparent",border:`1px solid ${t.bd}`,color:t.muD,cursor:"pointer",fontSize:12,opacity:voiceMode?0.3:1}}>대화 내역 초기화</button>
            )}
          </div>
        )}

        {/* ── TAB 4: 메모 ── */}
        {tab===4&&(
          <div>
            <div style={{background:t.card,borderRadius:12,padding:16,border:`1px solid ${t.bdD}`,marginBottom:16}}>
              <h3 style={{margin:"0 0 10px",fontSize:11,color:t.ac,letterSpacing:2,textTransform:"uppercase"}}>{editNoteIdx!==null?"✏️ 메모 수정":"자유 메모"}</h3>
              <textarea value={memo} onChange={e=>setMemo(e.target.value)} placeholder="오늘 배운 것, 느낀 것을 자유롭게..." rows={4} style={{...S({resize:"vertical"})}} />
              <div style={{display:"flex",gap:8,marginTop:8}}>
                <button onClick={()=>{
                  if(!memo.trim())return;
                  if(editNoteIdx!==null){setNotes(p=>p.map((n,i)=>i===editNoteIdx?{text:memo,date:new Date().toLocaleString("ko-KR")}:n));setEditNoteIdx(null);}
                  else setNotes(p=>[{text:memo,date:new Date().toLocaleString("ko-KR")},...p]);
                  setMemo("");
                }} style={{flex:1,padding:"9px",borderRadius:8,background:t.acBg,border:`1px solid ${t.acBd}`,color:t.ac,cursor:"pointer",fontSize:13,fontWeight:600}}>
                  {editNoteIdx!==null?"✅ 수정 완료":"메모 저장"}
                </button>
                {editNoteIdx!==null&&<button onClick={()=>{setEditNoteIdx(null);setMemo("");}} style={{padding:"9px 16px",borderRadius:8,background:"transparent",border:`1px solid ${t.bd}`,color:t.muD,cursor:"pointer",fontSize:13}}>취소</button>}
              </div>
            </div>
            {notes.length===0?(
              <div style={{textAlign:"center",padding:"40px 20px",color:t.muD}}><div style={{fontSize:40,marginBottom:12}}>📓</div><p>오늘 배운 것을 자유롭게 기록해보세요</p></div>
            ):notes.map((n,i)=>(
              <div key={i} style={{padding:"12px 14px",background:t.card,borderRadius:10,marginBottom:10,border:`1px solid ${t.bdD}`,borderLeft:`3px solid ${t.acBd}`}}>
                <p style={{margin:"0 0 8px",lineHeight:1.7,fontSize:14,whiteSpace:"pre-wrap"}}>{n.text}</p>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontSize:11,color:t.muD}}>{n.date}</span>
                  <div style={{display:"flex",gap:6}}>
                    <button onClick={()=>{setMemo(n.text);setEditNoteIdx(i);window.scrollTo({top:0,behavior:"smooth"});}} style={{padding:"3px 10px",borderRadius:6,border:`1px solid ${t.acBd.replace("0.4","0.3")}`,background:"transparent",color:t.ac,cursor:"pointer",fontSize:11}}>수정</button>
                    <button onClick={()=>{if(confirm("삭제할까요?"))setNotes(p=>p.filter((_,idx)=>idx!==i));}} style={{padding:"3px 10px",borderRadius:6,border:"1px solid rgba(200,80,80,0.3)",background:"transparent",color:"#e88a8a",cursor:"pointer",fontSize:11}}>삭제</button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ── Root App ──
function App() {
  const [lang,setLang]=useState(()=>LS("ln_lang",null));
  const [apiKey,setApiKey]=useState(()=>LS("ln_apikey",""));
  const setLangAndSave=lc=>{SS("ln_lang",lc);setLang(lc);};
  const goBack=()=>{SS("ln_lang",null);setLang(null);};
  const saveKey=k=>{SS("ln_apikey",k);setApiKey(k);};
  const resetKey=()=>{SS("ln_apikey","");setApiKey("");};

  if(!apiKey) return <ApiSetup onSave={saveKey}/>;
  if(!lang) return <LangSelect onSelect={setLangAndSave}/>;
  return <LangApp lc={lang} apiKey={apiKey} onBack={goBack} onResetKey={resetKey}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
